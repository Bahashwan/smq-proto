<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>معاينة الرابط · الرئيسية · 1200×630</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
<div dir="rtl" style="width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden; position: relative; background: #141311; color: #FFFFFF; font-family: 'Noto Kufi Arabic', 'Segoe UI', system-ui, sans-serif; font-feature-settings: 'tnum' 1">
  <!-- Big cut block, gold -->
  <div style="position: absolute; left: 0; top: 0; width: 460px; height: 630px; background: #B48F2E; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0)"></div>
  <div style="position: absolute; left: 460px; top: 0; width: 120px; height: 630px; background: #B48F2E; clip-path: polygon(0 0, 100% 0, 0 100%)"></div>
  <!-- Honeycomb hint -->
  <div style="position: absolute; left: 60px; top: 110px; display: grid; grid-template-columns: repeat(3, 100px); gap: 8px 6px">
    <span style="width: 100px; height: 100px; background: #141311; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)"></span>
    <span style="width: 100px; height: 100px; background: #FFFFFF; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)"></span>
    <span style="width: 100px; height: 100px; background: #141311; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)"></span>
    <span style="width: 100px; height: 100px; background: #141311; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); margin-left: 50px"></span>
    <span style="width: 100px; height: 100px; background: #141311; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); margin-left: 50px"></span>
    <span></span>
    <span style="width: 100px; height: 100px; background: #FFFFFF; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)"></span>
    <span style="width: 100px; height: 100px; background: #141311; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)"></span>
  </div>
  <!-- Text -->
  <div style="position: absolute; right: 72px; top: 80px; width: 540px; display: flex; flex-direction: column; gap: 22px">
    <img src="assets/lockup-goldmark-white.png" alt="إس إم كيو العقارية" style="height: 64px; width: auto; align-self: flex-start">
    <span style="font-size: 52px; font-weight: 800; line-height: 1.2">شقق وفلل روف<br>بأسعار معلنة في جدة</span>
    <span style="font-size: 22px; line-height: 1.6; color: #C9C2B3">ابدأ من ميزانيتك. الروضة من 459,000 ريال.<br>لا «اتصل للسعر».</span>
  </div>
  <div style="position: absolute; right: 72px; bottom: 44px; display: flex; align-items: center; gap: 16px; font-size: 18px; font-weight: 700; color: #B48F2E"><span style="width: 14px; height: 14px; background: #B48F2E; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%)"></span>smq-re.com</div>
  <span style="position: absolute; left: 24px; bottom: 20px; font-size: 12px; font-weight: 700; color: #3D3010">OG-Home · 1200×630 · يُستخدم أيضاً لـ من نحن والخدمات وتواصل · النص يُحدَّث من أقل سعر متاح</span>
</div>
</body>
</html>
