<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ورقة الفلاتر · 390</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6C1E}a:hover{color:#141311}
</style>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #FFFFFF; color: #141311; font-family: 'Noto Kufi Arabic', 'Segoe UI', system-ui, sans-serif; font-feature-settings: 'tnum' 1">

  <!-- Dimmed page behind -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: #141311; opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; top: 0; right: 0; left: 0; height: 64px; background: #141311"></div>

  <!-- Bottom sheet -->
  <div role="dialog" aria-label="الفلاتر" style="position: absolute; right: 0; left: 0; bottom: 0; height: 760px; background: #FFFFFF; display: flex; flex-direction: column; clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 42px, 100% 100%, 0 100%)">

    <!-- Sheet header -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 16px; border-bottom: 1.5px solid #141311">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800">الفلاتر</h2>
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" style="height: 40px; padding: 0 10px; font: inherit; font-size: 13px; font-weight: 700; border: 0; background: transparent; color: #8A6C1E; cursor: pointer; text-decoration: underline">مسح الكل</button>
        <a href="Results-M.html" aria-label="إغلاق" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #141311; text-decoration: none; font-size: 24px; line-height: 1">×</a>
      </div>
    </div>

    <!-- Active chips -->
    <div style="display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid #D4CFC4">
      <button type="button" style="flex: none; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; font: inherit; font-size: 12px; font-weight: 700; border: 1.5px solid #141311; background: #F3F1EB; color: #141311; cursor: pointer">الروضة <span aria-label="إزالة">×</span></button>
      <button type="button" style="flex: none; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; font: inherit; font-size: 12px; font-weight: 700; border: 1.5px solid #141311; background: #F3F1EB; color: #141311; cursor: pointer">حتى 700,000 <span aria-label="إزالة">×</span></button>
      <button type="button" style="flex: none; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; font: inherit; font-size: 12px; font-weight: 700; border: 1.5px solid #141311; background: #F3F1EB; color: #141311; cursor: pointer">شقق <span aria-label="إزالة">×</span></button>
    </div>

    <!-- Scrollable body -->
    <form style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 0 16px">

      <!-- Location -->
      <fieldset style="margin: 0; padding: 14px 0; border: 0; border-bottom: 1px solid #D4CFC4; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; font-size: 12px; font-weight: 700; color: #5E5A52; margin-bottom: 8px">الموقع</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">المدينة<select style="height: 44px; padding: 0 8px; font: inherit; font-size: 13px; font-weight: 700; color: #141311; border: 1.5px solid #141311; background: #FFFFFF"><option>جدة</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">الحي<select style="height: 44px; padding: 0 8px; font: inherit; font-size: 13px; font-weight: 700; color: #141311; border: 1.5px solid #141311; background: #F3F1EB"><option>الروضة</option><option>الكل</option></select></label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">المشروع<select style="height: 44px; padding: 0 8px; font: inherit; font-size: 13px; font-weight: 700; color: #141311; border: 1.5px solid #141311; background: #FFFFFF"><option>الكل</option><option>جاردن الروضة</option></select></label>
        </div>
      </fieldset>

      <!-- Type + rooms -->
      <fieldset style="margin: 0; padding: 14px 0; border: 0; border-bottom: 1px solid #D4CFC4; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; font-size: 12px; font-weight: 700; color: #5E5A52; margin-bottom: 8px">نوع الوحدة</legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; border: 1.5px solid #141311; background: #141311; color: #FFFFFF; cursor: pointer">شقة</button>
          <button type="button" style="height: 38px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; border: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">فيلا روف</button>
          <button type="button" style="height: 38px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; border: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">فيلا</button>
          <button type="button" style="height: 38px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; border: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">دوبلكس</button>
        </div>
        <span style="font-size: 12px; font-weight: 700; color: #5E5A52; margin-top: 4px">الغرف</span>
        <div role="group" aria-label="عدد الغرف" style="display: flex; border: 1.5px solid #141311; align-self: flex-start">
          <button type="button" aria-pressed="true" style="width: 54px; height: 40px; font: inherit; font-size: 14px; font-weight: 700; border: 0; border-left: 1.5px solid #141311; background: #141311; color: #FFFFFF; cursor: pointer">الكل</button>
          <button type="button" style="width: 46px; height: 40px; font: inherit; font-size: 14px; font-weight: 700; border: 0; border-left: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">2</button>
          <button type="button" style="width: 46px; height: 40px; font: inherit; font-size: 14px; font-weight: 700; border: 0; border-left: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">3</button>
          <button type="button" style="width: 46px; height: 40px; font: inherit; font-size: 14px; font-weight: 700; border: 0; border-left: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">4</button>
          <button type="button" style="width: 46px; height: 40px; font: inherit; font-size: 14px; font-weight: 700; border: 0; background: #FFFFFF; color: #141311; cursor: pointer">5+</button>
        </div>
      </fieldset>

      <!-- Price -->
      <fieldset style="margin: 0; padding: 14px 0; border: 0; border-bottom: 1px solid #D4CFC4; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; font-size: 12px; font-weight: 700; color: #5E5A52; margin-bottom: 8px">السعر بالريال</legend>
        <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">من<input type="text" inputmode="numeric" value="300,000" style="height: 44px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 800; color: #141311; border: 1.5px solid #141311; direction: ltr; text-align: right; font-feature-settings: 'tnum' 1"></label>
          <span aria-hidden="true" style="height: 44px; display: flex; align-items: center; color: #5E5A52">إلى</span>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">إلى<input type="text" inputmode="numeric" value="700,000" style="height: 44px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 800; color: #141311; border: 1.5px solid #141311; background: #F3F1EB; direction: ltr; text-align: right; font-feature-settings: 'tnum' 1"></label>
        </div>
        <div style="position: relative; height: 24px">
          <div style="position: absolute; top: 11px; right: 0; left: 0; height: 2px; background: #D4CFC4"></div>
          <div style="position: absolute; top: 11px; right: 0; width: 24%; height: 2px; background: #141311"></div>
          <button type="button" aria-label="الحد الأدنى" style="position: absolute; top: 0; right: -12px; width: 24px; height: 24px; padding: 0; border: 0; background: #141311; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); cursor: pointer"></button>
          <button type="button" aria-label="الحد الأعلى" style="position: absolute; top: 0; right: calc(24% - 12px); width: 24px; height: 24px; padding: 0; border: 0; background: #B48F2E; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); cursor: pointer"></button>
        </div>
      </fieldset>

      <!-- Area -->
      <fieldset style="margin: 0; padding: 14px 0; border: 0; border-bottom: 1px solid #D4CFC4; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; font-size: 12px; font-weight: 700; color: #5E5A52; margin-bottom: 8px">المساحة م²</legend>
        <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">من<input type="text" inputmode="numeric" placeholder="80" style="height: 44px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 800; color: #141311; border: 1.5px solid #141311; direction: ltr; text-align: right"></label>
          <span aria-hidden="true" style="height: 44px; display: flex; align-items: center; color: #5E5A52">إلى</span>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">إلى<input type="text" inputmode="numeric" placeholder="420" style="height: 44px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 800; color: #141311; border: 1.5px solid #141311; direction: ltr; text-align: right"></label>
        </div>
      </fieldset>

      <!-- Status + delivery -->
      <fieldset style="margin: 0; padding: 14px 0; border: 0; border-bottom: 1px solid #D4CFC4; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; font-size: 12px; font-weight: 700; color: #5E5A52; margin-bottom: 8px">حالة المشروع والتسليم</legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; border: 1.5px solid #141311; background: #141311; color: #FFFFFF; cursor: pointer">الكل</button>
          <button type="button" style="height: 38px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; border: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">جاهز</button>
          <button type="button" style="height: 38px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; border: 1.5px solid #141311; background: #FFFFFF; color: #141311; cursor: pointer">قيد الإنشاء</button>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 600; color: #5E5A52">التسليم قبل<select style="height: 44px; padding: 0 8px; font: inherit; font-size: 13px; font-weight: 700; color: #141311; border: 1.5px solid #141311; background: #FFFFFF"><option>بدون تحديد</option><option>نهاية 2026</option><option>منتصف 2027</option><option>نهاية 2027</option></select></label>
      </fieldset>

      <!-- Feature toggles -->
      <fieldset style="margin: 0; padding: 14px 0 20px 0; border: 0; display: flex; flex-direction: column; gap: 4px">
        <legend style="padding: 0; font-size: 12px; font-weight: 700; color: #5E5A52; margin-bottom: 8px">المميزات</legend>
        <label style="display: flex; align-items: center; justify-content: space-between; height: 44px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #F3F1EB">غرفة خادمة<input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #141311"></label>
        <label style="display: flex; align-items: center; justify-content: space-between; height: 44px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #F3F1EB">غرفة سائق<input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #141311"></label>
        <label style="display: flex; align-items: center; justify-content: space-between; height: 44px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #F3F1EB">بلكونة<input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #141311"></label>
        <label style="display: flex; align-items: center; justify-content: space-between; height: 44px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #F3F1EB">سطح خاص<input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #141311"></label>
        <label style="display: flex; align-items: center; justify-content: space-between; height: 44px; font-size: 14px; font-weight: 600">سمارت هوم<input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #141311"></label>
      </fieldset>
    </form>

    <!-- Sheet footer -->
    <div style="display: flex; gap: 10px; padding: 12px 16px 16px 16px; border-top: 1.5px solid #141311; background: #FFFFFF">
      <a href="Results-M.html" style="flex: 1; display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; background: #141311; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 800; clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 19px, 100% 100%, 0 100%)">اعرض 6 وحدات <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B48F2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    </div>
  </div>
</div>
</body>
</html>
