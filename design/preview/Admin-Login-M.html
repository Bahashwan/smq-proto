<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>دخول الإدارة · 390</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6C1E}a:hover{color:#141311}
</style>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F8F7F4; color: #141311; font-family: 'Noto Kufi Arabic', 'Segoe UI', system-ui, sans-serif; font-feature-settings: 'tnum' 1; display: flex; flex-direction: column">
  <div style="padding: 28px 20px 24px 20px; background: #141311; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px; clip-path: polygon(0 0, 100% 0, 100% 100%, 40px 100%, 0 calc(100% - 23px))">
    <img src="assets/lockup-goldmark-white.png" alt="إس إم كيو العقارية" style="height: 30px; width: auto; align-self: flex-start">
    <span style="font-size: 12px; font-weight: 700; color: #B48F2E; margin-top: 8px">لوحة الإدارة</span>
    <span style="font-size: 22px; font-weight: 800; line-height: 1.3">الوحدات والطلبات والأرقام، من جوالك</span>
  </div>
  <form style="display: flex; flex-direction: column; gap: 14px; padding: 24px 20px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">تسجيل الدخول</h1>
    <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 2px solid #B48F2E; background: #FFFDF6; font-size: 13px; line-height: 1.6"><span style="flex: none; width: 10px; height: 10px; margin-top: 6px; background: #B48F2E; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%)"></span><span>البريد أو كلمة المرور غير صحيحة. بقيت محاولتان.</span></div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #5E5A52">البريد الإلكتروني<input type="email" value="saud@smqre.com" style="height: 52px; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 600; color: #141311; border: 2px solid #B48F2E; direction: ltr; text-align: right; background: #FFFFFF"></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: #5E5A52">كلمة المرور<span style="display: flex; border: 2px solid #B48F2E; background: #FFFFFF"><input type="password" value="••••••••••" style="flex: 1; min-width: 0; height: 48px; padding: 0 14px; font: inherit; font-size: 15px; font-weight: 600; color: #141311; border: 0; direction: ltr; text-align: right"><button type="button" aria-label="إظهار كلمة المرور" style="width: 48px; border: 0; border-right: 1.5px solid #D4CFC4; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141311" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 13px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #141311">تذكرني 30 يوماً</label>
    <button type="submit" style="height: 54px; font: inherit; font-size: 16px; font-weight: 800; border: 0; background: #141311; color: #FFFFFF; cursor: pointer; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 21px, 100% 100%, 0 100%)">دخول</button>
    <a href="#reset" style="font-size: 13px; font-weight: 700; text-decoration: none; align-self: flex-start">نسيت كلمة المرور؟</a>
  </form>
  <span style="margin-top: auto; padding: 16px 20px; font-size: 11px; color: #5E5A52">للفريق فقط · لا تسجيل جديد من هنا</span>
</div>
</body>
</html>
